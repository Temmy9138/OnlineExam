<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Verify Reset Code | ExamPro Admin</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20213a; background: #f3f5ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: linear-gradient(135deg, #213394, #4e5dcc); }
    .card { width: min(100%, 450px); padding: 38px; border: 1px solid #e8eaf4; border-radius: 20px; background: #fff; box-shadow: 0 22px 65px rgba(20, 31, 83, .2); }
    .brand { margin: 0 0 28px; color: #213394; font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
    .brand span { color: #6d7df5; }
    .icon { width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 16px; background: #eef1ff; font-size: 26px; }
    h1 { margin: 0 0 9px; font-size: clamp(24px, 6vw, 30px); letter-spacing: -.8px; }
    .intro { margin: 0 0 24px; color: #6f7288; font-size: 14px; line-height: 1.65; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    input { width: 100%; height: 50px; padding: 0 14px; border: 1px solid #dfe2ee; border-radius: 10px; color: #20213a; background: #f8f9ff; font: inherit; }
    input[readonly] { color: #60657d; }
    input:focus { outline: 3px solid rgba(89, 107, 224, .14); border-color: #596be0; }
    .field { margin-bottom: 17px; }
    .code { font-size: 24px; font-weight: 750; letter-spacing: 12px; text-align: center; }
    .hint { display: block; margin-top: 8px; color: #85889b; font-size: 12px; }
    button { width: 100%; min-height: 50px; margin-top: 5px; border: 0; border-radius: 10px; color: #fff; background: #213394; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #172775; }
    button:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin-bottom: 17px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
    .message.error { display: block; color: #a32235; background: #fff0f1; border: 1px solid #ffd6da; }
    .message.success { display: block; color: #17663b; background: #edfaf2; border: 1px solid #c9efd7; }
    .back { display: block; margin-top: 21px; color: #5667cf; text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 28px 22px; border-radius: 16px; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Exam<span>Pro</span></p>
    <div class="icon" aria-hidden="true">✉️</div>
    <h1>Check your admin email</h1>
    <p class="intro">Enter the 4-digit password reset code we sent to the email address below. The code expires in 10 minutes.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="verifyForm" novalidate>
      <div class="field">
        <label for="email">Admin email address</label>
        <input id="email" type="email" readonly autocomplete="email">
      </div>
      <div class="field">
        <label for="code">4-digit verification code</label>
        <input class="code" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required>
        <small class="hint">Check your inbox and spam folder.</small>
      </div>
      <button id="verifyButton" type="submit">Verify code</button>
    </form>
    <a class="back" href="adminforgotten_password.html">Request another code</a>
  </main>
  <script>
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const form = document.getElementById('verifyForm');
    const message = document.getElementById('message');
    const button = document.getElementById('verifyButton');
    emailInput.value = localStorage.getItem('exampro_adminResetEmail') || '';

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    if (!emailInput.value) {
      form.hidden = true;
      showMessage('The admin email is missing. Request a new reset code.', 'error');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const code = codeInput.value.trim();
      if (!/^\d{4}$/.test(code)) {
        showMessage('Enter the 4-digit code from your email.', 'error');
        codeInput.focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'Checking code…';
      message.className = 'message';
      try {
        const response = await fetch('/api/admin/password-reset/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), code })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not verify that code.');
        if (!data.resetToken) throw new Error('The server did not return a password reset token. Request a new code.');
        localStorage.removeItem('exampro_adminResetEmail');
        window.location.href = 'adminreset_newpassword.html?token=' + encodeURIComponent(data.resetToken);
      } catch (error) {
        showMessage(error.message || 'Could not verify that code.', 'error');
        button.disabled = false;
        button.textContent = 'Verify code';
      }
    });
  </script>
</body>
</html>
