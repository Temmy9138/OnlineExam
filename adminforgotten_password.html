<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPro Admin Forgot Password</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: linear-gradient(
        135deg,
        #213394,
        #4e5dcc
    );

    padding: 20px;
}


/* =========================
   CONTAINER
========================= */

.forgot-container {

    width: 100%;

    max-width: 430px;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.2);
}


/* =========================
   LOGO
========================= */

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #213394;

    margin-bottom: 10px;
}

.logo span {

    color: #6d7df5;
}


/* =========================
   ICON
========================= */

.forgot-icon {

    width: 70px;

    height: 70px;

    border-radius: 50%;

    background: #eef1ff;

    color: #213394;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 10px auto 20px;

    font-size: 32px;
}


/* =========================
   TITLE
========================= */

.forgot-title {

    text-align: center;

    margin-bottom: 25px;
}

.forgot-title h2 {

    color: #222;

    margin-bottom: 8px;
}

.forgot-title p {

    color: #777;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================
   FORM
========================= */

.form-group {

    margin-bottom: 20px;
}

.form-group label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    color: #333;

    margin-bottom: 8px;
}

.form-group input {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid #ddd;

    border-radius: 8px;

    outline: none;

    font-size: 15px;

    transition: 0.3s;
}

.form-group input:focus {

    border-color: #213394;

    box-shadow:
        0 0 0 3px rgba(33,51,148,0.1);
}


/* =========================
   ERROR
========================= */

.error-message {

    display: none;

    background: #ffe8e8;

    color: #d00000;

    padding: 10px;

    border-radius: 7px;

    font-size: 13px;

    margin-bottom: 15px;

    text-align: center;
}


/* =========================
   SUCCESS
========================= */

.success-message {

    display: none;

    background: #e7f8ed;

    color: #16803c;

    padding: 10px;

    border-radius: 7px;

    font-size: 13px;

    margin-bottom: 15px;

    text-align: center;

    line-height: 1.5;
}


/* =========================
   BUTTON
========================= */

.reset-btn {

    width: 100%;

    padding: 14px;

    background: #213394;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.reset-btn:hover {

    background: #172775;
}

.reset-btn:disabled {

    opacity: 0.7;

    cursor: not-allowed;
}


/* =========================
   BACK TO LOGIN
========================= */

.back-login {

    text-align: center;

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #eee;

    font-size: 14px;

    color: #777;
}

.back-login a {

    color: #213394;

    font-weight: bold;

    text-decoration: none;
}

.back-login a:hover {

    text-decoration: underline;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    margin-top: 20px;

    color: #aaa;

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        padding: 15px;
    }

    .forgot-container {

        padding: 25px 20px;

        border-radius: 12px;
    }

    .logo {

        font-size: 26px;
    }

    .forgot-title h2 {

        font-size: 21px;
    }

    .forgot-icon {

        width: 60px;

        height: 60px;

        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- =========================
     FORGOT PASSWORD
========================= -->

<div class="forgot-container">


    <!-- LOGO -->

    <div class="logo">

        Exam<span>Pro</span>

    </div>


    <!-- ICON -->

    <div class="forgot-icon">

        🔐

    </div>


    <!-- TITLE -->

    <div class="forgot-title">

        <h2>Forgot Password?</h2>

        <p>

            Enter your admin email address and
            we will send a secure 4-digit password reset code
            to your email inbox.

        </p>

    </div>


    <!-- ERROR -->

    <div
        class="error-message"
        id="errorMessage">

    </div>


    <!-- SUCCESS -->

    <div
        class="success-message"
        id="successMessage">

    </div>


    <!-- FORM -->

    <form id="forgotForm">


        <div class="form-group">

            <label for="email">

                Admin Email Address

            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your admin email"
                required
                autocomplete="email">

        </div>


        <button
            type="submit"
            class="reset-btn"
            id="resetBtn">

            Send Reset Code

        </button>


    </form>


    <!-- BACK TO LOGIN -->

    <div class="back-login">

        Remember your password?

        <a href="adminlogin.html">

            Back to Login

        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 ExamPro. All Rights Reserved.

    </div>


</div>



<script>

/* =========================
   FORGOT PASSWORD
========================= */

document
    .getElementById("forgotForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const error =
                document
                .getElementById("errorMessage");


            const success =
                document
                .getElementById("successMessage");


            const button =
                document
                .getElementById("resetBtn");


            /* HIDE MESSAGES */

            error.style.display = "none";

            success.style.display = "none";


            /* CHECK EMAIL */

            if (!email) {

                error.textContent =
                    "Please enter your email address.";

                error.style.display = "block";

                return;
            }


            /* EMAIL VALIDATION */

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                error.textContent =
                    "Please enter a valid email address.";

                error.style.display = "block";

                return;
            }


            /* LOADING */

            button.disabled = true;

            button.textContent = "Sending...";

            try {
                const res = await fetch('/api/admin/password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 404) {
                    error.textContent = 'That email address is not registered to an admin account. Check the address and try again.';
                    error.style.display = 'block';
                    button.disabled = false;
                    button.textContent = 'Send Reset Code';
                    return;
                }
                if (!res.ok) {
                    throw new Error(data.error || 'Could not send reset code.');
                }
                success.textContent = data.message || 'A 4-digit reset code was sent. Check your inbox and spam folder.';
                success.style.display = 'block';
                localStorage.setItem('exampro_adminResetEmail', email);
                button.textContent = 'Code Sent';
                window.location.href = 'adminreset_verify.html';
            } catch (err) {
                error.textContent = err.message || 'Cannot connect to server.';
                error.style.display = 'block';
                button.disabled = false;
                button.textContent = 'Send Reset Code';
            }

        }
    );

</script>

</body>
</html>
