<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Reset Admin Password | ExamPro</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20213a;
      background: #f3f5ff;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #e6e9ff 0, transparent 38%), #f5f6fc;
    }
    .card {
      width: min(100%, 450px);
      padding: 38px;
      background: #fff;
      border: 1px solid #e8eaf4;
      border-radius: 20px;
      box-shadow: 0 22px 65px rgba(34, 45, 110, .12);
    }
    .brand { margin: 0 0 28px; color: #213394; font-size: 22px; font-weight: 800; letter-spacing: -.6px; }
    .brand span { color: #6d7df5; }
    .icon {
      width: 54px; height: 54px; display: grid; place-items: center; margin-bottom: 20px;
      border-radius: 16px; background: #eef1ff; color: #3446b4; font-size: 25px;
    }
    h1 { margin: 0 0 9px; font-size: clamp(24px, 6vw, 30px); letter-spacing: -.8px; }
    .intro { margin: 0 0 27px; color: #6f7288; font-size: 14px; line-height: 1.65; }
    .field { margin: 0 0 18px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%; height: 48px; padding: 0 14px; border: 1px solid #dfe2ee; border-radius: 10px;
      color: #20213a; background: #fff; font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #596be0; box-shadow: 0 0 0 4px rgba(89, 107, 224, .12); }
    .hint { display: block; margin-top: 7px; color: #85889b; font-size: 12px; }
    button {
      width: 100%; min-height: 49px; margin-top: 5px; border: 0; border-radius: 10px;
      color: #fff; background: #213394; font: inherit; font-weight: 700; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    button:hover:not(:disabled) { background: #172775; transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
    .message.error { display: block; color: #a32235; background: #fff0f1; border: 1px solid #ffd6da; }
    .message.success { display: block; color: #17663b; background: #edfaf2; border: 1px solid #c9efd7; }
    .back { display: block; margin-top: 22px; color: #5667cf; text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 28px 22px; border-radius: 16px; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Exam<span>Pro</span></p>
    <div class="icon" aria-hidden="true">🔐</div>
    <h1>Choose a new password</h1>
    <p class="intro">Set a new password for your administrator account. This secure link expires after 15 minutes and can only be used once.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="resetForm" novalidate>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="1024" required>
        <small class="hint">Use at least 8 characters.</small>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="1024" required>
      </div>
      <button id="submitButton" type="submit">Update password</button>
    </form>
    <a class="back" href="adminlogin.html">Back to admin login</a>
  </main>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');
    const resetToken = new URLSearchParams(window.location.search).get('token');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    if (!resetToken) {
      form.hidden = true;
      showMessage('This reset link is missing or invalid. Please request a new password reset email.', 'error');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!resetToken) return;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        showMessage('Your new password must be at least 8 characters.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('The passwords do not match. Please check them and try again.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating password…';
      message.className = 'message';
      try {
        const response = await fetch('/api/admin/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resetToken, newPassword })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not update the password.');
        history.replaceState(null, '', window.location.pathname);
        form.hidden = true;
        showMessage('Your password has been updated. Redirecting to admin login…', 'success');
        setTimeout(() => { window.location.href = 'adminlogin.html'; }, 1400);
      } catch (error) {
        showMessage(error.message || 'Could not update your password. Request a new reset email and try again.', 'error');
        button.disabled = false;
        button.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
